# Bare `npm test` is unit-only and needs no database. This compose file is a
# prerequisite for `npm run test:integration` / `npm run test:all` and for
# `npm run server`, not for `npm test`. The healthcheck is what lets
# `npm run db:up` block until the server actually accepts connections.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lang_tutor
    ports:
      - '5432:5432'
    volumes:
      - lang-tutor-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30

  # A generic, pinned mock HTTP server standing in for the Gemini API in every
  # test bucket. Deliberately third-party and behaviour-free: each test pushes
  # its own expectations in at runtime, which is what makes one shared instance
  # safe across several checkouts — the same reason the Postgres container is
  # safe to share while a first-party mock would not be.
  mockserver:
    image: mockserver/mockserver:5.15.0
    ports:
      - '1080:1080'
    environment:
      MOCKSERVER_LIVENESS_HTTP_GET_PATH: /liveness/probe
    # No healthcheck, unlike db above, and not an oversight: this image is
    # distroless. Its whole filesystem under bin/ is java, openssl and
    # c_rehash — no shell, so CMD-SHELL cannot run, and no curl or wget for a
    # CMD exec form either. A Docker healthcheck can only probe from inside the
    # container, so readiness is waited for from the host instead, in
    # scripts/wait-for-mockserver.sh, which `npm run db:up` runs. Mounting a
    # probe script in would work and is deliberately not done: a bind mount
    # this container needs is a first-party file every checkout must have,
    # which is exactly the coupling that makes one shared instance unsafe.

  # The pg-boss web dashboard (http://localhost:3000): queues, jobs, retries and
  # the dead-letter queue (ADR 0007). It reads lane 0's database, the one this
  # compose file creates; compose itself only runs from lane 0 (ADR 0006), and
  # 3000 is outside every lane's ports (3001/8081 plus a thousand per slot).
  # pg-boss publishes no image, so the pinned npm package runs in a plain Node
  # image, with the npm cache in a volume so a restart does not re-download it.
  # Bound to 127.0.0.1 because it has no login and can retry, cancel and delete
  # jobs. Local only: `npm run db:up` skips it in CI.
  pgboss-dashboard:
    image: node:24-alpine
    command: ['npx', '-y', '@pg-boss/dashboard@1.10.0']
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/lang_tutor
      PGBOSS_SCHEMA: pgboss
      PORT: '3000'
      HOST: 0.0.0.0
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - pgboss-dashboard-npm:/root/.npm
    depends_on:
      db:
        condition: service_healthy
    # Before the first `npm run db:migrate` there is no pgboss schema yet: the
    # dashboard keeps running and answers 500, then works once the migration
    # has installed it, with no restart. The restart policy is for real crashes.
    restart: unless-stopped

volumes:
  lang-tutor-pgdata:
  pgboss-dashboard-npm:
