name: CI

# Every branch, every push. Deliberately no `pull_request` trigger: for branches in
# this repo `push` already fires on every commit a PR would contain, so adding it
# would run the whole suite twice per PR. Push-event check runs satisfy branch
# protection on master exactly as pull-request-event runs do.
#
# workflow_dispatch is inherited from the separate eval workflow this absorbed.
# test-eval is the one job here whose result can change with no commit of ours,
# so re-running the suite by hand against an unchanged tree has to stay possible.
on:
  push:
  workflow_dispatch:

# npm ci runs install lifecycle scripts from the whole dependency tree on every
# push. None of these jobs write to the repo, so pin the token to read-only rather
# than inheriting whatever the repository default happens to be.
permissions:
  contents: read

# A run against a commit that is no longer the branch tip is not worth finishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job IDs are the branch-protection check contexts, so keep them stable once a
  # ruleset lists them — and do not add `name:` keys, which would rename the
  # context out from under it. `master`'s ruleset currently requires no status
  # checks at all, which is why renaming `test` (and splitting `typecheck` into
  # these two) below was free. See the README.
  #
  # Grep over the tree: no dependencies, no database, no npm ci, so it needs no
  # setup step at all and reports a violation in seconds. Until ADR 0001's check
  # existed, its rules were a checklist in a document that only ran if someone
  # remembered to run it — every other invariant in this repo (schema drift, the
  # unit/integration split) is enforced by a job. check-adrs.sh discovers
  # scripts/check-adr-*.sh by naming convention, so a new ADR's script needs no
  # edit here — see the create-adr skill.
  check-adrs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-adrs.sh

  check-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # Root install: the root package.json owns resolution for all four workspaces.
      - run: npm ci
      - run: npm run typecheck

  # No database, deliberately. A "unit" test that secretly needs Postgres fails
  # here, loudly, instead of passing because a database happened to be reachable.
  # This is what makes the src/ vs tests/integration/ boundary a fact rather than
  # a convention.
  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # Root install: the root package.json owns resolution for all four workspaces.
      - run: npm ci
      - run: npm test

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Must come after checkout: it reads docker-compose.yml from the tree. The
      # `services:` block this replaces duplicated the postgres:17 image and its
      # healthcheck; `--wait` blocks on the compose healthcheck exactly as that
      # block's `options: --health-cmd` did. Invoked through `npm run db:up`
      # rather than `docker compose` directly so there is one definition of the
      # prerequisites: since phase 9 that is two containers, and MockServer's
      # readiness is waited for from the host because its image is distroless
      # and cannot run a healthcheck of its own.
      - run: npm run db:up
      # The drift steps need no database — drizzle-kit generate and check never
      # connect — but they belong with the other database concerns rather than
      # muddying test-unit's single purpose.
      #
      # db:check only validates that the migrations folder's own snapshot/journal
      # are internally consistent (e.g. two branches both generating a migration
      # against the same prior state) — it never compares schema.ts against the
      # committed migrations, so an edited schema.ts with no `generate` run passes
      # it silently. Regenerating and diffing is what actually catches that drift:
      # if schema.ts and the migrations folder disagree, `generate` produces a new
      # file and/or rewrites the journal, and the diff step fails the build.
      - run: npm run db:check -w apps/server
      - run: npm run db:generate -w apps/server
      - name: Fail if schema.ts and the committed migrations have drifted
        run: |
          # git diff alone would miss a brand-new, still-untracked migration file;
          # git status --porcelain catches both a rewritten journal/snapshot and a
          # new file that generate produced but nobody committed.
          if [ -n "$(git status --porcelain apps/server/src/db/migrations)" ]; then
            echo "schema.ts and the committed migrations have drifted." >&2
            echo "Run 'npm run db:generate -w apps/server' and commit the result." >&2
            git status --porcelain apps/server/src/db/migrations >&2
            exit 1
          fi
      - run: npm run test:integration

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:up

      # Browser binaries change when Playwright does, not when the lockfile does,
      # so the cache is keyed on the resolved version. Read from the e2e workspace
      # so it resolves whether or not npm hoists the package to the root.
      - name: Resolve Playwright version
        id: playwright
        working-directory: e2e
        run: |
          version=$(node -p 'require("@playwright/test/package.json").version')
          [ -n "$version" ] || { echo "could not resolve @playwright/test version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # --with-deps installs Chromium's system libraries, which Ubuntu runners do
      # not ship. Without it the browser fails to launch with a shared-library
      # error that looks nothing like a test failure. It runs even on a cache hit:
      # the apt packages live outside the cached directory.
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # Starts both servers itself — the Hono server and a freshly built static web
      # export. Nothing needs to be running first, and nothing is special-cased for
      # CI beyond what playwright.config.ts already does via process.env.CI.
      - run: npm run e2e

      # trace: 'retain-on-failure' is already set in the config, but a failure before
      # Playwright even runs (npm ci, or the browser install) leaves
      # e2e/test-results/ never created, so if-no-files-found: ignore covers that case.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The prompt eval bucket, calling the real paid model. It lived in its own
  # workflow (nightly + workflow_dispatch) precisely so a vendor's model update
  # could not turn a branch red with no commit of ours; moving it here accepts
  # that trade deliberately, in exchange for learning about a prompt regression
  # at the commit that caused it rather than at 03:17 the next morning. Two
  # consequences to keep in mind when this job is the only red one: it can fail
  # without anything in the diff being wrong, and every push spends real quota.
  # See ADR 0004 R4.
  #
  # No database and no MockServer, unlike every other job that touches the
  # Gemini client: the eval calls the real API and refuses to run against a
  # localhost base URL. The 10 cases run concurrently (EVAL_CONCURRENCY,
  # default 4), so the call itself is ~15s and npm ci dominates the job.
  test-eval:
    # Never on a fork: secrets are not exposed to fork workflows, so the job
    # would fail on a missing key for a reason no outside contributor can fix.
    # A skipped job is neutral to branch protection; a failing one is not.
    if: github.repository_owner == 'victor-prp'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run eval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}

      # The scorecard is the artifact, not the exit code: a tier 2 drop needs the
      # per-case output to diagnose, and on a pass it is the baseline the next
      # run gets diffed against. Hence always(), not failure().
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: apps/server/tests/eval/.results/
          if-no-files-found: ignore
          retention-days: 7
