# A signal, not a gate. Never on pull_request: a model update can turn this red
# with no change to this repository, and an external vendor's release schedule
# must not be able to block a merge.
#
# Action versions and the Node setup match ci.yml deliberately — one convention
# per repo, so a runner upgrade is one search rather than two.
name: eval

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  eval:
    # Never on a fork: this job holds the only API key in the repository.
    if: github.repository_owner == 'victor-prp'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # No database and no MockServer: the eval calls the real API directly and
      # refuses to run against a local base URL.
      - run: npm run eval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: apps/server/tests/eval/.results/
          if-no-files-found: ignore
